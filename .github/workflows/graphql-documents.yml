# Checks the GraphQL documents in the app's source against graphql/schema.graphql: the API's consumer schema this
# app is built and tested against (a copy of audience_kit_api's contracts/schema/schema.graphql from its `next`), so
# a renamed field fails before it ships. When the app starts using something new, copy the API's dump in with the
# change. Pull requests into `next` and `main` also check that the matching deployed API serves all of that copy (deployed-api.yml).
name: GraphQL documents

on:
  push:
    paths:
      - "HotMess/**/*.swift"
      - "HotMessTests/**/*.swift"
      - "graphql/**"
      - "scripts/graphql/**"
      - ".github/workflows/graphql-documents.yml"
  pull_request:
    paths:
      - "HotMess/**/*.swift"
      - "HotMessTests/**/*.swift"
      - "graphql/**"
      - "scripts/graphql/**"
      - ".github/workflows/graphql-documents.yml"

jobs:
  check:
    name: Documents match the consumer schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Hot Mess talks only to the consumer endpoint (/graphql), never
      # /staffql: managers use Velvet and Backstage.
      - name: No staff endpoint in Hot Mess
        run: |
          if grep -rnE 'endpoint: \.staff|# endpoint: staff|/staffql' HotMess HotMessTests; then
            echo "::error::Hot Mess must not call the staff endpoint (staffql)."
            exit 1
          fi
      - name: GraphQL documents match the schema the app is built against
        run: |
          npm install --silent --no-save --no-package-lock --prefix .graphql-check graphql@16
          cp scripts/graphql/check.mjs .graphql-check/check.mjs
          node .graphql-check/check.mjs --schema graphql/schema.graphql --endpoint consumer HotMess
