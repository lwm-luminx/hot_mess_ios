# Checks the GraphQL documents in the app's source against the AudienceKit
# consumer schema, so a renamed field fails before it ships. See
# https://developer.audiencekit.com/api/validate-documents/.
#
# The schema dump and the checker publish from audience-kit's `main`, so while
# this app tracks the API's `next` branch a field added there fails here until
# the API ships; hence `continue-on-error` for now. Drop it once the API and
# the app are on the same release.
name: GraphQL documents

on:
  push:
    paths:
      - "HotMess/**/*.swift"
      - "HotMessTests/**/*.swift"
      - ".github/workflows/graphql-documents.yml"
  pull_request:
    paths:
      - "HotMess/**/*.swift"
      - "HotMessTests/**/*.swift"
      - ".github/workflows/graphql-documents.yml"

jobs:
  check:
    name: Documents match the consumer schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GraphQL documents match the API schema
        # The dumps publish from audience-kit `main`; this branch tracks `next`.
        continue-on-error: true
        run: |
          mkdir -p .graphql-check && cd .graphql-check
          curl -fsSLO https://developer.audiencekit.com/graphql/check.mjs
          curl -fsSLO https://developer.audiencekit.com/graphql/schema.graphql
          npm install --silent --no-save --no-package-lock graphql@16
          node check.mjs --schema schema.graphql --endpoint consumer ../HotMess ../HotMessTests
          # Writing and managing posts go to the staff view (`# endpoint: staff`).
          curl -fsSLO https://developer.audiencekit.com/graphql/staff_schema.graphql
          node check.mjs --schema staff_schema.graphql --only-endpoint staff ../HotMess
